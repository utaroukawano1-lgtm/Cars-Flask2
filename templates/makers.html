{% extends "layout.html" %}
{% block body %}
<div class="three-column">

    {% for Cars in results %}

    <div class="makers">

        <h2>{{ Cars[1] }} {{ Cars[2] }}</h2>

        <a href="{{ url_for('Cars', id=Cars[0]) }}">

            <img src="{{ Cars[3] }}"
                 alt="{{ Cars[2] }}"
                 class="grid-image">

        </a>

    </div>

    {% endfor %}

</div>

{% endblock %}
