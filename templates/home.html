{% extends "layout.html" %}

{% block body %}

<div class="one-column">
    <h2>Featured Article</h2>

    {% for car in trending %}
    <div class="w3-card-4 trending-card">
        <a href="{{ url_for('article', id=car[0]) }}">
            <img src="https://b2160055.smushcdn.com/2160055/wp-content/uploads/2025/12/mclaren.jpg?lossy=2&strip=1&webp=1"
     style="width:800px; height:auto; display:block; margin-left:70px;">        </a>
    </div>
    {% endfor %}
</div>

<div class="three-column">

    {% for car in results %}
    <div class="w3-card-4">

        <h2>{{ car[1] }} {{ car[2] }}</h2>

        <a href="{{ url_for('Cars', id=car[0]) }}">

            <img src="{{ car[3] }}"
                 alt="{{ car[2] }}"
                 class="grid-image">

        </a>

    </div>
    {% endfor %}

</div>

{% endblock %}
